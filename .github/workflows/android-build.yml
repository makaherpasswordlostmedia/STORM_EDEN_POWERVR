name: Android Build

# Собирает Android APK (Eden / Storm Eden PowerVR fork) и
# выкладывает его как GitHub Actions Artifact, доступный для скачивания
# со страницы запуска workflow.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'relWithDebInfo'
        type: choice
        options:
          - relWithDebInfo
          - release

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake via sdkmanager
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          sdkmanager --install "cmake;3.30.5"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ runner.os }}
          max-size: 2G

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > src/android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x src/android/gradlew

      - name: Set Gradle JVM args
        run: |
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          sed -i '/^org\.gradle\.jvmargs/d' ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties

      - name: Remove hardcoded Windows java.home from project gradle.properties
        working-directory: src/android
        run: |
          sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          cat gradle.properties

      - name: Build APK (${{ github.event.inputs.build_type || 'relWithDebInfo' }})
        working-directory: src/android
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          set +e
          LOGFILE=/tmp/gradle-build.log

          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            TASK=assembleRelease
          else
            TASK=assembleRelWithDebInfo
          fi

          ./gradlew "$TASK" --stacktrace --parallel \
            -PYUZU_ANDROID_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache;-DCMAKE_CXX_COMPILER_LAUNCHER=ccache" \
            > "$LOGFILE" 2>&1
          STATUS=$?

          echo "===== Последние 200 строк лога ====="
          tail -n 200 "$LOGFILE"

          if [ $STATUS -ne 0 ]; then
            echo "===== Сборка провалилась (exit $STATUS). Полный лог см. в артефакте gradle-build-log ====="
          fi

          exit $STATUS

      - name: Upload full build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.sha }}
          path: /tmp/gradle-build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Locate built APK(s)
        id: find_apk
        working-directory: src/android
        run: |
          mkdir -p /tmp/apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} /tmp/apk-out/ \;
          ls -la /tmp/apk-out

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storm-eden-android-${{ github.sha }}
          path: /tmp/apk-out/*.apk
          retention-days: 14
          if-no-files-found: error
